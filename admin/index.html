<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Connexion admin — LM86 Services</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="page-connexion">
  <div class="carte-connexion">
    <div class="logo-connexion">
      <svg width="34" height="34" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5.6S11 21.2 11 30a13 13 0 0 0 26 0C37 21.2 24 5.6 24 5.6Z" fill="#2B8FF5"/>
        <path d="M25.5 17 16.5 29h6.5l-1 8 9.5-12.5H25L25.5 17Z" fill="#F5A623"/>
      </svg>
      <span><span class="nom">LM86 Services</span><span class="sous">ADMINISTRATION</span></span>
    </div>

    <div id="zoneErreur"></div>

    <form id="formConnexion" autocomplete="on">
      <div class="champ-groupe">
        <label for="identifiant">Identifiant</label>
        <input id="identifiant" name="identifiant" type="text" autocomplete="username" required>
      </div>
      <div class="champ-groupe">
        <label for="motDePasse">Mot de passe</label>
        <input id="motDePasse" name="motDePasse" type="password" autocomplete="current-password" required>
      </div>
      <button class="bouton" type="submit" id="boutonConnexion">Se connecter</button>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";
  var form = document.getElementById('formConnexion');
  var zoneErreur = document.getElementById('zoneErreur');
  var bouton = document.getElementById('boutonConnexion');

  // deja connecte ? on saute directement au tableau de bord
  fetch('/api/session').then(function(r){ return r.json(); }).then(function(s){
    if(s && s.connecte) window.location.href = 'dashboard.html';
  }).catch(function(){});

  form.addEventListener('submit', function(e){
    e.preventDefault();
    zoneErreur.innerHTML = '';
    bouton.disabled = true;
    bouton.textContent = 'Connexion...';

    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        identifiant: document.getElementById('identifiant').value,
        motDePasse: document.getElementById('motDePasse').value
      })
    })
    .then(function(r){ return r.text().then(function(t){ var d=null; try{ d=JSON.parse(t);}catch(e){} return { ok:r.ok, d:d }; }); })
    .then(function(res){
      if(!res.ok){
        var msg = (res.d && res.d.erreur) || (res.status === 413 ? 'Requete trop volumineuse.' : 'Connexion impossible.');
        zoneErreur.innerHTML = '<div class="message-erreur">' + msg + '</div>';
        bouton.disabled = false;
        bouton.textContent = 'Se connecter';
        return;
      }
      window.location.href = 'dashboard.html';
    })
    .catch(function(){
      zoneErreur.innerHTML = '<div class="message-erreur">Serveur injoignable.</div>';
      bouton.disabled = false;
      bouton.textContent = 'Se connecter';
    });
  });
})();
</script>
</body>
</html>
